services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Java Backend (Free Tier Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: silver-muller-seals-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/inventory/transaction-types
    envVars:
      - key: PORT
        value: "4000"

  # ----------------------------------------------------------------------------
  # 2. Vite React Frontend (Static Site - Automatically Free on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: silver-muller-seals-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
