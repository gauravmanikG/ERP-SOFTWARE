spring.application.name=silver-muller-seals-backend

# Server port — Render passes PORT environment variable (defaults to 4000)
server.port=${PORT:4000}

# DataSource configuration
# Uses PostgreSQL if SPRING_DATASOURCE_URL is set (e.g. Supabase / Render Postgres).
# Defaults to an in-memory H2 database if no external database URL is configured.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sms_seals;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Hibernate auto table creation/update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Run schema.sql against the database on every startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

