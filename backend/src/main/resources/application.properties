spring.application.name=silver-muller-seals-backend

# Server port: set the PORT environment variable to override (defaults to 4000)
server.port=${PORT:4000}

# DataSource configuration
# Defaults to local PostgreSQL on port 5434 (sms_seals database).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/sms_seals}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate: validate mode enforces schema.sql as the single source of truth. Startup fails if any JPA entity
# column is missing from schema.sql. No automatic schema changes — every change is deliberate and reviewed.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JSON: Spring Boot 4 uses Jackson 3. Keep the Jackson 2 defaults this API was built and tested with (property order as
# declared, not alphabetical; nulls accepted for primitive fields), so API responses and JSON already stored in the
# database (PO line items, Capital PO amendments, settings) read and write exactly as before the upgrade.
spring.jackson.use-jackson2-defaults=true

# Every startup runs schema.sql (DDL only) then seed-data.sql (insert-only reference rows). Startup must never reset
# or delete existing data: see docs/startup-data-rules.md. A failing statement stops startup instead of being skipped.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed-data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# Browser origins (scheme://host:port, comma-separated) allowed to call this API. Set APP_CORS_ALLOWED_ORIGINS when the
# frontend is served from anywhere else, e.g. a deployed URL or another PC on the LAN.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Key for the Super Admin "view password" feature (pgcrypto symmetric encryption of each newly set password).
# Keep it secret and never commit it; set APP_PASSWORD_VIEW_KEY in backend/.env. Empty = the feature is off.
app.security.password-view-key=${APP_PASSWORD_VIEW_KEY:}

# GST state code of the company's own registration (GSTIN 06AFBFS8991J1ZC, Haryana). PO by PR and Direct PO charge
# CGST + SGST to vendors in this state and IGST to vendors elsewhere.
app.company.gst-state-code=${APP_COMPANY_GST_STATE_CODE:06}

# First-time password of the two built-in accounts (superadmin@ / developer@silverseals.com), used once when a NEW
# database is set up. Empty = the public development default. Any install other people can reach must set
# APP_BOOTSTRAP_PASSWORD before its first start; both accounts must change it at first sign-in anyway.
app.security.bootstrap-password=${APP_BOOTSTRAP_PASSWORD:}

# Behind a reverse proxy (nginx, IIS, a cloud load balancer) trust its X-Forwarded-* headers so the API knows the
# address users really opened. Tomcat only accepts them from private-network proxies.
server.forward-headers-strategy=native

# PO Validity: users allowed to extend a PO validity date (comma-separated, case-insensitive)
purchase.validity.extend-authorized-users=General Manager (Purchases & SCM)

# Service PO: maximum PO total (incl. GST) an APPROVER may approve. Leave empty for no limit (ADMIN is never limited).
service-po.approval-limit=
