spring.application.name=silver-muller-seals-backend

# Server port — matches the old Express server's default (4000)
server.port=${PORT:4000}

# PostgreSQL connection — defaults to the local Windows PostgreSQL install
# (postgresql-x64-18 on port 5434). Do NOT use Docker's :5432 here unless that
# container has a named volume; ephemeral Docker DBs lose data on restart.
# Override via SPRING_DATASOURCE_URL / USERNAME / PASSWORD if needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/sms_seals}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql against the database on every startup (safe: uses
# CREATE EXTENSION IF NOT EXISTS / CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
