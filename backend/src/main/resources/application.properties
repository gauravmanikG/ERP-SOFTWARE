spring.application.name=silver-muller-seals-backend

# Server port — Render passes PORT environment variable (defaults to 4000)
server.port=${PORT:4000}

# DataSource configuration
# Defaults to local PostgreSQL on port 5434 (sms_seals database).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/sms_seals}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate auto table creation/update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Run schema.sql against the database on every startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

