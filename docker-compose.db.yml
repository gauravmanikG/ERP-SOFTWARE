# Brand-new server: also runs PostgreSQL in Docker (data in the named volume "sms-db-data") and points the ERP at it.
#
#   Windows (cmd):  set POSTGRES_PASSWORD=<choose one>
#                   set APP_BOOTSTRAP_PASSWORD=<first password of the built-in admin accounts>
#   Linux/macOS:    export POSTGRES_PASSWORD=... APP_BOOTSTRAP_PASSWORD=...
#   (or put both in a file named .env next to this one)
#
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up -d --build
#
# Both values are required: the start is refused without them, so a new server never comes up with the public
# development password. Keep using the same two -f files for ps / logs / down.

services:
  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sms_seals
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (the bundled database password)}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:?Set APP_BOOTSTRAP_PASSWORD (first password of the built-in admin accounts)}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_seals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (the bundled database password)}
    volumes:
      - sms-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sms_seals"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sms-db-data:
